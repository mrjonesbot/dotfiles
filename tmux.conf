# improve colors
set -g default-terminal 'screen-256color'

# act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

set -g prefix2 C-s

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set-window-option -g pane-base-index 1

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# soften status bar color from harsh green to light gray
set -g status-style bg='#666666',fg='#aaaaaa'

# remove administrative debris (session name, hostname, time) in status bar
set -g status-left ''
set -g status-right ''

# increase scrollback lines
set -g history-limit 10000

# prefix -> back-one-character
bind-key C-b send-prefix
# prefix-2 -> forward-incremental-history-search
bind-key C-s send-prefix -2

# don't suspend-client
unbind-key C-z

# split vertical and horizontal panes
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# nudge (resize) panes with shift + arrow keys (no prefix)
bind-key -n S-Left  resize-pane -L 5
bind-key -n S-Right resize-pane -R 5
bind-key -n S-Up    resize-pane -U 5
bind-key -n S-Down  resize-pane -D 5

# move the current pane into a new session named after its directory
bind-key b run-shell "~/dotfiles/bin/tmux-break-to-session '#{b:pane_current_path}' '#{pane_id}'"

# pick another session from a simple list in a full-width split below
bind-key C-j split-window -v -f -l 30% "~/dotfiles/bin/tmux-pick-session"

bind-key C-k send-keys -R \; clear-history

# tmux reload
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Ctrl-h/j/k/l moves between tmux panes and nvim splits
bind -n C-h if -F "#{m/ri:^n?vim?$,#{pane_current_command}}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{m/ri:^n?vim?$,#{pane_current_command}}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{m/ri:^n?vim?$,#{pane_current_command}}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{m/ri:^n?vim?$,#{pane_current_command}}" "send-keys C-l" "select-pane -R"

# Local config
if-shell "[ -f ~/.tmux.conf.local ]" 'source ~/.tmux.conf.local'
